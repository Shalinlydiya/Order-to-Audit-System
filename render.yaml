# One-click hosting on Render.com (Blueprint). Persistent disk keeps the SQLite DB.
services:
  - type: web
    name: order-to-audit
    runtime: docker
    plan: starter
    envVars:
      - {key: SECRET_KEY, generateValue: true}
      - {key: DB_PATH, value: /data/factory.db}
    disk: {name: data, mountPath: /data, sizeGB: 1}
